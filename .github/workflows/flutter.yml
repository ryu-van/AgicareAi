name: Flutter mobile

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile_flutter/**', '.github/workflows/flutter.yml']
  push:
    branches: [main]
    paths: ['apps/mobile_flutter/**', '.github/workflows/flutter.yml']

permissions:
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration checklist counts
        shell: pwsh
        run: ./tool/verify_flutter_checklist.ps1

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor dev --dart-define=API_BASE_URL=https://api.example.com --dart-define=DEV_AUTH_ENABLED=true

  ios-simulator-verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --simulator --no-codesign --dart-define=API_BASE_URL=https://api.example.com --dart-define=DEV_AUTH_ENABLED=true

  android-emulator-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/mobile_flutter
          script: flutter test integration_test/app_test.dart -d emulator-5554 --dart-define=API_BASE_URL=https://api.example.com --dart-define=DEV_AUTH_ENABLED=true

  api-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests -q

  release-preflight:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Verify release inputs stay outside source control
        shell: bash
        run: |
          if test -f android/key.properties; then
            echo 'android/key.properties must never be committed.'
            exit 1
          fi
          test -f pubspec.lock

  android-production-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    env:
      FLUTTER_API_BASE_URL: ${{ secrets.FLUTTER_API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate required release secrets
        shell: bash
        run: |
          test -n "$FLUTTER_API_BASE_URL"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Materialize protected Android signing inputs
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build signed production bundle
        run: flutter build appbundle --release --flavor production --dart-define=API_BASE_URL="$FLUTTER_API_BASE_URL" --dart-define=DEV_AUTH_ENABLED=false
      - name: Scan signed production bundle
        run: pwsh tool/scan_release_artifact.ps1 -ArtifactPath build/app/outputs/bundle/productionRelease/app-production-release.aab
      - name: Upload signed production bundle for release evidence
        uses: actions/upload-artifact@v4
        with:
          name: agricare-flutter-production-aab-${{ github.run_number }}
          path: apps/mobile_flutter/build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove protected signing inputs
        if: always()
        shell: bash
        run: rm -f android/key.properties android/upload-keystore.jks
